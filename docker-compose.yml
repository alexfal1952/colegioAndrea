# Versiones alineadas con XAMPP 8.2.12:
# PHP 8.2.12 | Apache 2.4.58 | MariaDB 10.4.32 | phpMyAdmin 5.2.1

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: andrea-backend
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_NAME: Andrea
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: andrea
      DB_USERNAME: andrea
      DB_PASSWORD: secret
      FRONTEND_URL: http://localhost:5173
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://0.0.0.0:5173
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - andrea

  mariadb:
    image: mariadb:10.4.32
    container_name: andrea-mariadb
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: andrea
      MYSQL_USER: andrea
      MYSQL_PASSWORD: secret
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uandrea", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - andrea

  phpmyadmin:
    image: phpmyadmin:5.2.1
    container_name: andrea-phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mariadb
      PMA_USER: andrea
      PMA_PASSWORD: secret
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - andrea

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: andrea-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:8000/api
    depends_on:
      - backend
    networks:
      - andrea

volumes:
  mariadb_data:
  frontend_node_modules:

networks:
  andrea:
    driver: bridge
