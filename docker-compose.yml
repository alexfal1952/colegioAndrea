# Versiones alineadas con XAMPP 8.2.12:
# PHP 8.2.12 | Apache 2.4.58 | MariaDB 10.4.32 | phpMyAdmin 5.2.1
#
# HTTPS público: Caddy compartido en ~/Documentos/reverse-proxy/
#   https://libroclases.ddns.net        → frontend
#   https://libroclases.ddns.net:8000   → API

name: libroclases

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: andrea-backend
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_NAME: Andrea
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: ${APP_URL:-http://localhost:8000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - andrea

  mariadb:
    image: mariadb:10.4.32
    container_name: andrea-mariadb
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: andrea
      MYSQL_USER: andrea
      MYSQL_PASSWORD: secret
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uandrea", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - andrea

  phpmyadmin:
    image: phpmyadmin:5.2.1
    container_name: andrea-phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mariadb
      PMA_USER: andrea
      PMA_PASSWORD: secret
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - andrea

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: andrea-frontend
    ports:
      - "0.0.0.0:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_nuxt:/app/.nuxt
      - frontend_output:/app/.output
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:8000/api}
    depends_on:
      - backend
    networks:
      - andrea

volumes:
  mariadb_data:
  frontend_node_modules:
  frontend_nuxt:
  frontend_output:

networks:
  andrea:
    driver: bridge
